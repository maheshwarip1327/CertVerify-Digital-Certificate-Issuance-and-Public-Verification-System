<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify – CertVerify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/dashboard.css"/>
  <link rel="stylesheet" href="css/forms.css"/>
  <link rel="stylesheet" href="css/certificate.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <style>
    .verify-page { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-main); overflow-x: hidden; }
    .verify-nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .scanner-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; position: relative; overflow: hidden; }
    .scanner-bg { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    
    .scanner-box { width: 100%; max-width: 600px; background: var(--bg-sec); border: 1px solid var(--border); border-radius: 20px; padding: 40px 32px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5); z-index: 10; position: relative; overflow: hidden; }
    .scanner-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--cyan); box-shadow: var(--glow-cyan); animation: scan 2s linear infinite; display: none; }
    @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

    .scanner-input { font-family: monospace; font-size: clamp(1rem,4.5vw,1.5rem); text-align: center; letter-spacing: 2px; padding: 20px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.2); color: #fff; width: 100%; outline: none; transition: border-color 0.3s; margin-bottom: 24px; }
    .scanner-input:focus { border-color: var(--cyan); }
    
    /* Result Cards */
    .res-card { display: none; margin-top: 30px; text-align: left; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
    .res-card.active { display: block; animation: slideUp 0.4s ease; }
    .res-valid { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .res-invalid { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
    
    .cert-area { width: 100%; max-width: 900px; margin-top: 28px; z-index: 10; display: flex; flex-direction: column; gap: 14px; }
    .cert-area .cert-actions { justify-content: space-between; }
    .cert-note { color: var(--text-sec); font-size: .9rem; }
    .cert-v-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 20px; margin-top: 20px; }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="verify-page">
  <nav class="verify-nav">
    <a href="index.html" style="display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:700; font-size:1.25rem;">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,var(--cyan),var(--violet));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;"><i class="fa-solid fa-shield-halved"></i></div>
      CertVerify
    </a>
    <div>
      <a href="login.html" class="btn btn-secondary btn-sm" id="btn-dashboard-link">Login</a>
    </div>
  </nav>

  <div class="scanner-wrap">
    <div class="scanner-bg"></div>
    
    <div style="text-align:center; margin-bottom: 30px; z-index: 10;">
      <h1 style="font-family:var(--font-display); font-size:clamp(1.8rem,5vw,2.5rem); margin-bottom:10px;">Verify a credential</h1>
      <p style="color:var(--text-sec);">Enter the unique verification code to check authenticity.</p>
    </div>
    
    <div class="scanner-box">
      <div class="scanner-line" id="scanner-line"></div>
      
      <form id="verify-form">
        <input type="text" id="verify-code" class="scanner-input" placeholder="e.g. VCR-12345" required />
        <button type="submit" class="btn btn-primary btn-lg" id="verify-btn" style="width: 100%; justify-content: center;">
          <i class="fa-solid fa-search"></i> Verify Certificate
        </button>
      </form>
      
      <!-- Valid Result -->
      <div class="res-card res-valid" id="res-valid">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <h2 style="font-family:var(--font-display); color:var(--green); font-size:1.8rem; margin-bottom:5px;"><i class="fa-solid fa-circle-check"></i> Certificate Verified</h2>
            <p style="color:var(--text-sec); font-size:0.9rem;" id="res-msg">Authentic record found.</p>
          </div>
          <i class="fa-solid fa-certificate" style="font-size: 2.5rem; color: rgba(16,185,129,0.2);"></i>
        </div>
        
        <div class="cert-v-grid">
          <div><div style="font-size:0.7rem; color:var(--text-sec); text-transform:uppercase;">Participant</div><div style="font-size:1.1rem; font-weight:600; color:#fff;" id="res-name"></div></div>
          <div><div style="font-size:0.7rem; color:var(--text-sec); text-transform:uppercase;">Course</div><div style="font-size:1.1rem; font-weight:600; color:var(--cyan-light);" id="res-course"></div></div>
          <div><div style="font-size:0.7rem; color:var(--text-sec); text-transform:uppercase;">Certificate ID</div><div style="font-family:monospace; color:#fff;" id="res-id"></div></div>
          <div><div style="font-size:0.7rem; color:var(--text-sec); text-transform:uppercase;">Issue Date</div><div style="color:#fff;" id="res-date"></div></div>
        </div>
      </div>
      
      <!-- Invalid Result -->
      <div class="res-card res-invalid" id="res-invalid">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <h2 style="font-family:var(--font-display); color:var(--red); font-size:1.8rem; margin-bottom:5px;" id="invalid-title"><i class="fa-solid fa-triangle-exclamation"></i> INVALID</h2>
            <p style="color:var(--text-sec); font-size:0.9rem;" id="invalid-msg">The code provided is not valid.</p>
          </div>
          <i class="fa-solid fa-ban" style="font-size: 2.5rem; color: rgba(239,68,68,0.2);"></i>
        </div>
      </div>
      
    </div>

    <section id="cert-area" class="cert-area hidden" aria-label="Certificate">
      <div class="cert-actions">
        <span class="cert-note"><i class="fa-solid fa-certificate"></i> Certificate on record</span>
        <button class="btn btn-primary" id="print-cert-btn" type="button"><i class="fa-solid fa-print"></i> Print Certificate</button>
      </div>
      <div id="cert-preview"></div>
    </section>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="js/certificate.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
