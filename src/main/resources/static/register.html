<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account – CertVerify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/forms.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  <style>
    .auth-page { display: flex; min-height: 100vh; background: var(--bg-main); overflow: hidden; }
    
    .auth-left { 
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
      padding: 40px; position: relative; background: radial-gradient(circle at center, rgba(6,182,212,0.1), transparent 60%); 
    }
    
    .auth-right { 
      width: 100%; max-width: 500px; background: var(--bg-sec); display: flex; flex-direction: column; 
      justify-content: center; padding: 60px 40px; border-left: 1px solid var(--border); box-shadow: -20px 0 50px rgba(0,0,0,0.5); z-index: 10; overflow-y: auto;
    }
    
    .auth-brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: #fff; position: absolute; top: 40px; left: 40px; }
    .auth-brand-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--cyan), var(--violet)); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    
    .illustration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
    .ill-box { width: 100px; height: 100px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.3s; }
    .ill-box:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); }
    
    .ill-text { font-family: var(--font-display); font-size: 2.5rem; font-weight: 700; color: #fff; text-align: center; line-height: 1.2; }
    .ill-text span { color: var(--cyan); }
    
    .auth-header { margin-bottom: 30px; }
    .auth-header h1 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 8px; color: #fff; }
    .auth-header p { color: var(--text-sec); }
    
    .demo-creds { margin-top: 30px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 20px; font-size: 0.85rem; color: var(--text-sec); }
    .demo-creds h4 { color: #fff; margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .demo-row { display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.05); }
    .demo-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    
    .toggle-link { color: var(--cyan-light); cursor: pointer; font-weight: 600; margin-left: 5px; }
    .toggle-link:hover { text-decoration: underline; }
    
    .form-section { display: none; animation: fadeIn 0.3s ease; }
    .form-section.active { display: block; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="auth-page">
  <!-- Left Panel -->
  <div class="auth-left">
    <a href="index.html" class="auth-brand">
      <div class="auth-brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
      CertVerify
    </a>
    
    <div class="illustration-grid">
      <div class="ill-box" style="color: var(--cyan);"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="ill-box" style="color: var(--green);"><i class="fa-solid fa-circle-check"></i></div>
      <div class="ill-box" style="color: var(--violet-light);"><i class="fa-solid fa-lock"></i></div>
      <div class="ill-box" style="color: var(--blue-light);"><i class="fa-solid fa-certificate"></i></div>
    </div>
    
    <div class="ill-text">
      Secure Credentials.<br/><span>Trusted Verification.</span>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="auth-right">
    <div class="form-section active">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Register to access CertVerify. New accounts have the USER role.</p>
      </div>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <div class="input-with-icon"><i class="fa-solid fa-address-card input-icon"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Morgan" autocomplete="name" required/></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <div class="input-with-icon"><i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="reg-username" class="form-control" placeholder="At least 3 characters" autocomplete="username" required/></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-with-icon"><i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password" required/>
            <button type="button" class="input-toggle" onclick="togglePw('reg-password','t1')"><i class="fa-solid fa-eye" id="t1"></i></button></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <div class="input-with-icon"><i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" autocomplete="new-password" required/>
            <button type="button" class="input-toggle" onclick="togglePw('reg-confirm','t2')"><i class="fa-solid fa-eye" id="t2"></i></button></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="reg-btn" style="width:100%;justify-content:center;margin-top:10px;">
          Create Account <i class="fa-solid fa-user-plus"></i></button>
      </form>
      <div style="margin-top:24px;text-align:center;font-size:.9rem;color:var(--text-sec);">
        Already have an account? <a class="toggle-link" href="login.html">Sign In</a></div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
  function togglePw(id, icon) {
    const pw = document.getElementById(id), ic = document.getElementById(icon), show = pw.type === "password";
    pw.type = show ? "text" : "password"; ic.className = show ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
  }
  document.getElementById("register-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("reg-name").value.trim();
    const username = document.getElementById("reg-username").value.trim();
    const pw = document.getElementById("reg-password").value;
    const confirm = document.getElementById("reg-confirm").value;
    if (!name || !username || !pw || !confirm) return Toast.error("All fields are required.");
    if (pw !== confirm) return Toast.error("Passwords do not match.");
    const res = Auth.register(name, username, pw);   // saved to certverify_accounts with role USER
    if (!res.success) return Toast.error(res.message);
    Toast.success("Account created successfully.");
    setTimeout(() => window.location.replace("login.html?registered=1"), 900);
  });
</script>
</body>
</html>
